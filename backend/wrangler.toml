name = "commitcraft-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Create the namespace with:  npx wrangler kv namespace create CC_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "CC_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Non-secret configuration. Secrets (GITHUB_CLIENT_SECRET, SESSION_SECRET,
# ENCRYPTION_KEY) are set with `npx wrangler secret put <NAME>`.
[vars]
GITHUB_CLIENT_ID = "REPLACE_WITH_GITHUB_CLIENT_ID"
FRONTEND_URL = "https://your-app.vercel.app"
GITHUB_CALLBACK_URL = "https://your-app.vercel.app/api/auth/github/callback"
